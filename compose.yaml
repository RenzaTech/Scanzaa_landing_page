services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scanzaa
      POSTGRES_USER: scanzaa
      POSTGRES_PASSWORD: scanzaa-local-only
    volumes:
      - scanzaa-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scanzaa -d scanzaa"]
      interval: 5s
      timeout: 5s
      retries: 10
  scanzaa:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://scanzaa:scanzaa-local-only@database:5432/scanzaa}
      RATE_LIMIT_SECRET: ${RATE_LIMIT_SECRET:-local-development-only-change-me}
      CRON_SECRET: ${CRON_SECRET:-local-development-only-change-me}
      PRIVACY_POLICY_VERSION: ${PRIVACY_POLICY_VERSION:-v1}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_CLOUD_API_VERSION: ${WHATSAPP_CLOUD_API_VERSION:-}
      WHATSAPP_TEMPLATE_NAME: ${WHATSAPP_TEMPLATE_NAME:-}
      WHATSAPP_TEMPLATE_LANGUAGE: ${WHATSAPP_TEMPLATE_LANGUAGE:-en}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:-}
      WHATSAPP_WEBHOOK_VERIFY_TOKEN: ${WHATSAPP_WEBHOOK_VERIFY_TOKEN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      TEAM_NOTIFICATION_EMAIL: ${TEAM_NOTIFICATION_EMAIL:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "3001:3000"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  scanzaa-db-data:
